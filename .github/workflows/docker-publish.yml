            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-demo-amd64.outputs.digest }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-demo-arm64.outputs.digest }}
