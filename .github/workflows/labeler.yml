name: Pull Request Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration:
            area:api:
              - changed-files:
                  - any-glob-to-any-file: src/app/api/**/*

            area:ui:
              - changed-files:
                  - any-glob-to-any-file:
                      - src/components/**/*
                      - src/app/{login,setup,test}/**/*
                      - src/styles/**/*

            area:engine:
              - changed-files:
                  - any-glob-to-any-file: src/core/**/*

            area:plugins:
              - changed-files:
                  - any-glob-to-any-file:
                      - packages/wwv-plugin-sdk/**/*
                      - src/plugins/**/*
                      - src/core/plugins/**/*

            area:marketplace:
              - changed-files:
                  - any-glob-to-any-file:
                      - src/app/marketplace/**/*
                      - src/components/marketplace/**/*

            area:auth:
              - changed-files:
                  - any-glob-to-any-file:
                      - src/app/api/auth/**/*
                      - src/app/login/**/*

            area:ci:
              - changed-files:
                  - any-glob-to-any-file: .github/workflows/**/*

            area:deps:
              - changed-files:
                  - any-glob-to-any-file:
                      - package.json
                      - pnpm-lock.yaml
                      - pnpm-workspace.yaml
                      - next.config.ts

            area:db:
              - changed-files:
                  - any-glob-to-any-file: prisma/**/*

            area:docs:
              - changed-files:
                  - any-glob-to-any-file:
                      - '**/*.md'
                      - docs/**/*

            area:tests:
              - changed-files:
                  - any-glob-to-any-file:
                      - tests/**/*
                      - playwright.config.ts
                      - playwright.*.config.ts
                      - vitest.config.ts
                      - stryker.config.json
                      - '**/*.test.ts'
                      - '**/*.spec.ts'

            area:deploy:
              - changed-files:
                  - any-glob-to-any-file:
                      - Dockerfile*
                      - docker-compose*.yml
                      - docker/**/*
                      - deploy/**/*
                      - self-host/**/*
                      - docker-entrypoint.sh

            area:cli:
              - changed-files:
                  - any-glob-to-any-file:
                      - packages/wwv-cli/**/*
                      - scripts/**/*

            area:config:
              - changed-files:
                  - any-glob-to-any-file:
                      - .env.example
                      - .dockerignore
                      - .gitignore
                      - .nvmrc
                      - eslint.config.mjs
                      - tsconfig*.json
                      - .config/**/*
                      - .githooks/**/*
