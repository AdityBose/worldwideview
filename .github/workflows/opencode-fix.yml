name: OpenCode Autonomous Fix

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to fix
        required: true
        type: number

concurrency:
  group: opencode-fix-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  fix:
    if: |
      (github.event_name == 'issue_comment' && 
       (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && 
       github.event.label.name == 'agent-fix') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Get issue details
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number || 
              context.payload.inputs?.issue_number;
            
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            // Add running label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['agent-fix-running']
            });

            // Build prompt from issue
            const prompt = `Fix this issue in the repository:\n\nTitle: ${issue.title}\n\nDescription:\n${issue.body}\n\n1. Understand the issue\n2. Make the necessary code changes\n3. Run pnpm lint to check for errors\n4. Run pnpm test to verify nothing is broken\n5. Commit and push your changes to a new branch named fix/agent-issue-${issueNumber}\n6. Create a pull request with a clear description of the fix`;

            core.setOutput('issue_number', issueNumber.toString());
            core.setOutput('prompt', prompt);

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.17.13
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: deepseek/deepseek-v4-flash
          use_github_token: true
          share: false
          prompt: ${{ steps.issue.outputs.prompt }}

      - name: On success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.issue.outputs.issue_number }};
            
            // Remove running label
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'agent-fix-running'
            });

            // Find the PR created by OpenCode
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'fix/agent-issue-' + issueNumber,
              state: 'open'
            });

            let comment = '✅ OpenCode has finished working on this issue.';
            if (prs.length > 0) {
              comment += `\n\nPull Request: #${prs[0].number}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

      - name: On failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.issue.outputs.issue_number }};
            
            // Remove running label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'agent-fix-running'
              });
            } catch {}

            // Add failed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['agent-fix-failed']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '❌ OpenCode was unable to fix this issue automatically. The `agent-fix-failed` label has been added. Please review manually.'
            });
